<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New Inquiry — Urma Digital</title>
</head>
<body style="margin:0; padding:0; background-color:#0c0c0c;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0c0c0c; padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:560px; max-width:560px;">

          <!-- Top accent bar -->
          <tr>
            <td style="height:4px; line-height:4px; font-size:0; background:linear-gradient(90deg,#d45a1e,#e9742f); border-radius:4px 4px 0 0;">&nbsp;</td>
          </tr>

          <!-- Header -->
          <tr>
            <td style="background-color:#111111; padding:32px 40px 24px; border-radius:0; text-align:center;">
              <img src="https://deluxe-bunny-12f26d.netlify.app/logo-email.png" width="120" alt="Urma Digital" style="display:inline-block; width:120px; height:auto; border:0;" />
              <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:#8a8680; margin-top:14px;">
                New Project Inquiry
              </div>
            </td>
          </tr>

          <!-- Card body -->
          <tr>
            <td style="background-color:#161616; padding:8px 40px 32px;">

              <!-- Intro line -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; line-height:1.6; color:#a8a4a0; padding:16px 0 24px; border-bottom:1px solid rgba(255,255,255,0.08);">
                    You've received a new message from the contact form on <strong style="color:#f5f5f3;">urmadigital.com</strong>.
                  </td>
                </tr>
              </table>

              <!-- Fields -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:24px;">
                <tr>
                  <td style="padding:0 0 18px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
                    <div style="font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#8a8680; margin-bottom:4px;">Name</div>
                    <div style="font-size:15px; color:#f5f5f3; font-weight:600;">{{from_name}}</div>
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 0 18px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
                    <div style="font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#8a8680; margin-bottom:4px;">Email</div>
                    <div style="font-size:15px;"><a href="mailto:{{from_email}}" style="color:#e9742f; text-decoration:none; font-weight:600;">{{from_email}}</a></div>
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 0 18px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
                    <div style="font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#8a8680; margin-bottom:4px;">Phone</div>
                    <div style="font-size:15px;"><a href="tel:{{from_phone}}" style="color:#f5f5f3; text-decoration:none; font-weight:600;">{{from_phone}}</a></div>
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 0 4px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
                    <div style="font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#8a8680; margin-bottom:4px;">Service Interested In</div>
                    <div style="display:inline-block; font-size:13px; color:#e9742f; font-weight:600; background:rgba(212,90,30,0.12); border:1px solid rgba(212,90,30,0.3); border-radius:20px; padding:6px 14px; margin-top:4px;">{{service}}</div>
                  </td>
                </tr>
              </table>

              <!-- Message box -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:24px;">
                <tr>
                  <td style="background-color:#0c0c0c; border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:20px 22px;">
                    <div style="font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#8a8680; margin-bottom:10px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">Message</div>
                    <div style="font-size:14.5px; line-height:1.7; color:#e0ddd8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; white-space:pre-wrap;">{{message}}</div>
                  </td>
                </tr>
              </table>

              <!-- CTA button -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:28px;">
                <tr>
                  <td align="center">
                    <a href="mailto:{{from_email}}" style="display:inline-block; background:linear-gradient(90deg,#d45a1e,#e9742f); color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; font-weight:600; text-decoration:none; padding:13px 32px; border-radius:8px;">
                      Reply to {{from_name}}
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#111111; padding:20px 40px; border-radius:0 0 8px 8px; text-align:center; border-top:1px solid rgba(255,255,255,0.06);">
              <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:11px; color:#3a3835;">
                Submitted on {{time}} &middot; Urma Digital contact form
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
