<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Urma Digital — Letterhead</title>
</head>
<body style="margin:0; padding:0; background-color:#0c0c0c;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0c0c0c; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" style="width:560px; max-width:560px;">

          <!-- Top accent bar -->
          <tr>
            <td style="height:4px; line-height:4px; font-size:0; background:linear-gradient(90deg,#d45a1e,#e9742f); border-radius:4px 4px 0 0;">&nbsp;</td>
          </tr>

          <!-- Header -->
          <tr>
            <td style="background-color:#111111; padding:28px 40px 22px; text-align:center;">
              <img src="https://deluxe-bunny-12f26d.netlify.app/logo-email.png" width="110" alt="Urma Digital" style="display:inline-block; width:110px; height:auto; border:0;" />
            </td>
          </tr>

          <!-- Body — write your message here -->
          <tr>
            <td style="background-color:#161616; padding:36px 40px;">
              <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:15px; line-height:1.75; color:#e0ddd8;">
                Hi [Name],
                <br /><br />
                Write your message here...
                <br /><br />
                Best regards,<br />
                <strong style="color:#f5f5f3;">Urma Digital</strong>
              </div>
            </td>
          </tr>

          <!-- Footer / signature -->
          <tr>
            <td style="background-color:#111111; padding:20px 40px; border-radius:0 0 8px 8px; text-align:center; border-top:1px solid rgba(255,255,255,0.06);">
              <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:11px; color:#8a8680; line-height:1.6;">
                Urma Digital &middot; Web design &amp; development studio<br />
                <a href="mailto:urmadigital@gmail.com" style="color:#8a8680; text-decoration:none;">urmadigital@gmail.com</a> &middot; +373 79 45 49 43 &middot; Chișinău, MD
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
