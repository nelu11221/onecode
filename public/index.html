    <title>Urma Digital — Web Design & Development Studio</title>
    <style>
      *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
      html,body{background:#0c0c0c;color:#f5f5f3;font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh}
      .nav{position:fixed;top:0;left:0;width:100%;z-index:999;background:transparent;border-bottom:1px solid transparent;height:72px}
      .nav__inner{max-width:1280px;margin:0 auto;padding:0 clamp(20px,5vw,60px);height:72px;display:flex;align-items:center;justify-content:space-between}
      .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:140px clamp(20px,5vw,60px) 80px;overflow:hidden}
      .hero__content{text-align:center;max-width:880px}
      .hero__tag{font-size:.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:#d45a1e;margin-bottom:28px}
      .hero__title{font-size:clamp(2.8rem,7vw,5.5rem);font-weight:300;line-height:1.05;letter-spacing:-.03em;margin-bottom:28px}
      .hero__sub{font-size:clamp(1rem,1.5vw,1.2rem);color:#a8a4a0;line-height:1.7;max-width:560px;margin:0 auto 44px}
      @media (max-width:767px){
        .hero{background:#110C0B;justify-content:flex-start;align-items:stretch;padding:180px 20px 32px}
        .hero__content{text-align:left;max-width:100%}
        .hero__tag{font-size:.95rem;text-transform:none;letter-spacing:0;margin-bottom:18px}
        .hero__title{font-size:3.25rem;font-weight:400;line-height:1.04;letter-spacing:-.025em;margin-bottom:36px;text-align:left}
        .hero__sub{display:none}
      }
    </style>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
